{% extends "base.html" %}
{% block title %}Meetings Map — VCore{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #meetings-map { height: calc(100vh - 220px); min-height: 500px; border-radius: 12px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h4 class="mb-0"><i class="bi bi-map me-2"></i>Field Visits Map</h4>
        <small class="text-muted">{{ total }} check-in{{ 's' if total != 1 }} shown</small>
    </div>
    <a href="{{ url_for('meetings_list') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-list"></i> List View
    </a>
</div>

<!-- Filters -->
<div class="card mb-3">
    <div class="card-body py-2">
        <form method="GET" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label form-label-sm mb-1">Salesman</label>
                <select name="user_id" class="form-select form-select-sm">
                    <option value="">All Salesmen</option>
                    {% for u in users %}
                    <option value="{{ u.id }}" {% if request.args.get('user_id')|string == u.id|string %}selected{% endif %}>{{ u.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label form-label-sm mb-1">From Date</label>
                <input type="date" name="date_from" class="form-control form-control-sm" value="{{ request.args.get('date_from','') }}">
            </div>
            <div class="col-md-3">
                <label class="form-label form-label-sm mb-1">To Date</label>
                <input type="date" name="date_to" class="form-control form-control-sm" value="{{ request.args.get('date_to','') }}">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm w-100">Apply</button>
                <a href="{{ url_for('meetings_map') }}" class="btn btn-outline-secondary btn-sm">Clear</a>
            </div>
        </form>
    </div>
</div>

<!-- Map -->
<div id="meetings-map"></div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const meetingsData = {{ meetings_json | tojson }};

// User colour palette
const colours = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63'];
const userColours = {};
let colourIdx = 0;
function getColour(username) {
    if (!userColours[username]) {
        userColours[username] = colours[colourIdx % colours.length];
        colourIdx++;
    }
    return userColours[username];
}

function makeIcon(colour) {
    return L.divIcon({
        className: '',
        html: `<div style="width:16px;height:16px;border-radius:50%;background:${colour};
                            border:3px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
    });
}

// Build map centred on India if no data, else fit to markers
const map = L.map('meetings-map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
}).addTo(map);

if (meetingsData.length === 0) {
    map.setView([20.5937, 78.9629], 5);
} else {
    const bounds = [];
    meetingsData.forEach(m => {
        const colour = getColour(m.user);
        const marker = L.marker([m.lat, m.lng], { icon: makeIcon(colour) }).addTo(map);
        const popup = `
            <div style="min-width:200px;">
                <strong>${m.title}</strong><br>
                <span style="color:#666;font-size:12px;">${m.type}</span><br>
                ${m.client ? `<span style="font-size:12px;">👤 ${m.client}</span><br>` : ''}
                <span style="font-size:12px;">🕒 ${m.time}</span><br>
                <span style="font-size:12px;">📍 ${m.address.substring(0,80)}${m.address.length > 80 ? '…' : ''}</span><br>
                <span style="font-size:12px;color:#666;">by <strong>${m.user}</strong></span><br>
                <a href="/meetings/${m.id}" style="font-size:12px;" target="_blank">View Details →</a>
            </div>`;
        marker.bindPopup(popup);
        bounds.push([m.lat, m.lng]);
    });
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
}

// Legend
if (meetingsData.length > 0) {
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
        const div = L.DomUtil.create('div');
        div.style.cssText = 'background:white;padding:10px 14px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,0.2);font-size:13px;';
        let html = '<strong style="font-size:12px;text-transform:uppercase;letter-spacing:0.5px;">Salesmen</strong><br>';
        Object.entries(userColours).forEach(([name, colour]) => {
            html += `<span class="legend-dot" style="background:${colour};"></span>${name}<br>`;
        });
        div.innerHTML = html;
        return div;
    };
    legend.addTo(map);
}
</script>
{% endblock %}
