version: '3.8'

services:
  vcore:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://dbmasteruser:myvetropgpwd@ls-bcf74fccc09e57a790a55363aa6f915516415ae9.c7cuq02uskcx.ap-south-1.rds.amazonaws.com:5432/vcore?sslmode=require
      - SECRET_KEY=vcore-glassy-secret-key-2026-change-in-production
      - ENVIRONMENT=development
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
