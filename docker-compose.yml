version: '3.8'

services:
  vcore:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # DATABASE_URL and SECRET_KEY come from .env (loaded above).
      # Do NOT hardcode credentials here — this file is committed to git.
      - ENVIRONMENT=development
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
